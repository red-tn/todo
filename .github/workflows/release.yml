name: release

# Cut a release by pushing a version tag:
#   npm run release -- 0.2.0
#
# Builds Windows and macOS (Apple Silicon and Intel), signs the updater
# artifacts, and publishes a GitHub Release containing latest.json — which is
# the endpoint installed apps poll.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS build rather than separate arm64 and Intel jobs.
          # Each job updates latest.json on the same release, so concurrent
          # writers can clobber each other: that is how the Intel entry vanished
          # from v0.2.0 while its .dmg uploaded fine. Fewer writers means a
          # smaller window, and the verify job below turns any remaining loss
          # into a failed build rather than a release that looks fine.
          #
          # tauri-action lists a universal build under both darwin-aarch64 and
          # darwin-x86_64, each pointing at the same archive, so the updater's
          # default architecture lookup resolves without any custom target.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            name: macOS (universal)
          - platform: windows-latest
            args: ''
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        working-directory: src-tauri
        # Only the offline tests: the --ignored ones need a live database, and
        # the credential does not belong in CI.
        run: cargo test --lib

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Todo ${{ github.ref_name }}'
          releaseBody: 'Installed copies will offer this update from Settings.'
          # Stay a draft until every platform has uploaded. Each job writes to
          # the release as it finishes, so publishing immediately means the
          # manifest advertises a new version while the slower platform's
          # installer does not exist yet — clients on that platform see an
          # update, fail to find their entry, and error. Drafts are not served
          # by `releases/latest/download`, so clients keep seeing the previous
          # complete release until the verify job promotes this one.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # A release whose manifest is missing a platform looks completely healthy:
  # the installers upload, the run goes green, and the only symptom is that
  # machines on that platform quietly never see an update again. This turns
  # that into a failed build.
  verify:
    name: Verify and publish
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check latest.json covers every platform
        run: |
          set -euo pipefail
          # Fetched through the API rather than the public download URL,
          # because the release is still a draft at this point.
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern latest.json --output latest.json --clobber
          cat latest.json

          # A universal macOS build is published under both architecture keys,
          # each pointing at the same archive — there is no darwin-universal
          # key. Checking the arch keys is what actually proves a Mac can find
          # its update.
          missing=0
          for key in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            if ! jq -e --arg k "$key" '.platforms[$k]' latest.json >/dev/null; then
              echo "::error::latest.json is missing platform '$key'"
              missing=1
            fi
          done

          # An entry with no signature is worse than a missing one: the app
          # would download it and then refuse to install.
          if jq -e '[.platforms[] | select((.signature // "") == "")] | length > 0' latest.json >/dev/null; then
            echo "::error::latest.json contains an unsigned platform entry"
            missing=1
          fi

          version=$(jq -r .version latest.json)
          expected="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$expected" ]; then
            echo "::error::latest.json says version '$version' but the tag is '$expected'"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "manifest OK: version $version, platforms $(jq -r '.platforms | keys | join(", ")' latest.json)"

      # Only now does the release become visible to installed apps. Everything
      # is uploaded and the manifest is complete, so clients move straight from
      # the previous good release to this one with no window in between.
      - name: Publish the release
        run: |
          set -euo pipefail
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false --latest
          echo "published ${{ github.ref_name }}"
