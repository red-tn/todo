[package]
name = "tauri-app"
version = "0.2.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Only the tests need the #[tokio::test] macro; the app itself does not.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dependencies]
# macos-private-api backs the transparent window on macOS; it is a no-op on
# other platforms and must match `macOSPrivateApi` in tauri.conf.json.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "chrono",
] }
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }

# The updater is desktop-only; scoping it this way keeps a mobile build working.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

